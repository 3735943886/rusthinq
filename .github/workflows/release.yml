name: Release builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.2.0 or v0.2.0-dev1)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # Release archives carry the daemon and the consolidated tool suite. The
  # daemon's default features (bridge, scripting, gui) are the full set.
  BUILD_ARGS: -p rusthinq-app --bin rusthinq -p rusthinq-tools --bins
  BINARIES: >-
    rusthinq rusthinqctl rusthinq-setup rusthinq-migrate rusthinq-mcp
    rusthinq-capture rusthinq-retained-gc rusthinq-script-test
    packet-parser packet-sender lgcloud-monitor

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches workspace version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import tomllib
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?", tag) or tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must match workspace version v{version}")
          PYTHON
      - name: Reject an existing tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [ -n "$existing" ]; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

  build:
    needs: validate
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: false
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - name: linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            cross: true
          - name: macos-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The `openssl` dependency uses the `vendored` feature (builds
      # OpenSSL from source and statically links it), so no system OpenSSL is
      # needed anywhere below — only a working C toolchain for that target.
      - name: Install musl-tools (native linux-amd64 build)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install NASM (needed by vendored OpenSSL's asm on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build
        if: ${{ !matrix.cross }}
        # No explicit shell: default is bash on Linux/macOS and pwsh on Windows.
        # Forcing bash here would put Git for Windows' bundled perl (missing
        # CPAN modules openssl-sys's vendored build needs) ahead of Strawberry
        # Perl on PATH and break the Windows build.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} ${{ env.BUILD_ARGS }}

      - name: Build (cross)
        if: matrix.cross
        shell: bash
        run: cross build --release --target ${{ matrix.target }} ${{ env.BUILD_ARGS }}

      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          out="rusthinq-${RELEASE_TAG}-${{ matrix.name }}"
          mkdir "$out"
          for bin in ${{ env.BINARIES }}; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              cp "target/${{ matrix.target }}/release/$bin.exe" "$out/"
            else
              cp "target/${{ matrix.target }}/release/$bin" "$out/"
            fi
          done
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$out.zip" "$out" >/dev/null
          else
            tar -czf "$out.tar.gz" "$out"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rusthinq-${{ matrix.name }}
          path: |
            rusthinq-*.tar.gz
            rusthinq-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum rusthinq-* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # Versions with a suffix (v0.2.0-dev1) are prereleases and never become "Latest".
          prerelease: ${{ contains(inputs.tag, '-') }}
          make_latest: ${{ !contains(inputs.tag, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
