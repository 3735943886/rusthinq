name: Release builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # Packages shipped in release archives — the daemon and its setup tool.
  # rusthinq-bridge is a library (no binary); rusthinq-tools' RE/debug bins
  # are intentionally left out of releases.
  PACKAGES: -p rusthinq-cloud -p rusthinq-setup
  BINARIES: rusthinq-cloud rusthinq-setup
  # rusthinq-cloud ships with nothing enabled by default (see its Cargo.toml) --
  # release builds want the full feature set: LG-cloud bridge, Rhai device
  # scripting, and the web dashboard.
  FEATURES: bridge,scripting,gui

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: false
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: true
          - name: linux-armv7
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            cross: true
          - name: macos-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rusthinq-cloud's `openssl` dependency uses the `vendored` feature (builds
      # OpenSSL from source and statically links it), so no system OpenSSL is
      # needed anywhere below — only a working C toolchain for that target.
      - name: Install musl-tools (native linux-amd64 build)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install NASM (needed by vendored OpenSSL's asm on Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build
        if: ${{ !matrix.cross }}
        # No explicit shell: default is bash on Linux/macOS and pwsh on Windows.
        # Forcing bash here would put Git for Windows' bundled perl (missing
        # CPAN modules openssl-sys's vendored build needs) ahead of Strawberry
        # Perl on PATH and break the Windows build.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} ${{ env.PACKAGES }} --features ${{ env.FEATURES }}

      - name: Build (cross)
        if: matrix.cross
        shell: bash
        run: cross build --release --target ${{ matrix.target }} ${{ env.PACKAGES }} --features ${{ env.FEATURES }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="rusthinq-${{ inputs.tag }}-${{ matrix.name }}"
          mkdir "$out"
          for bin in ${{ env.BINARIES }}; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              cp "target/${{ matrix.target }}/release/$bin.exe" "$out/"
            else
              cp "target/${{ matrix.target }}/release/$bin" "$out/"
            fi
          done
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$out.zip" "$out" >/dev/null
          else
            tar -czf "$out.tar.gz" "$out"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusthinq-${{ matrix.name }}
          path: |
            rusthinq-*.tar.gz
            rusthinq-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
