name: Upstream Sync

# Daily check of anszom/rethink (the upstream TS project this crate ports) for
# new commits on master. Each new commit gets its own issue here, titled with
# the commit subject and bodied with the commit message, so it can be reviewed
# for whether it needs porting.

on:
  # schedule:
  #   - cron: '0 21 * * *' # 06:00 KST
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/anszom/rethink.git

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone upstream repo
        run: git clone --quiet "$UPSTREAM_REPO" upstream-repo

      - name: Create issues for new upstream commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE_FILE=.github/upstream-sync/last_sha.txt
          LAST_SHA=$(cat "$STATE_FILE")
          NEW_HEAD=$(git -C upstream-repo rev-parse origin/master)

          if [ "$LAST_SHA" = "$NEW_HEAD" ]; then
            echo "No new upstream commits."
            exit 0
          fi

          mapfile -t SHAS < <(git -C upstream-repo rev-list --reverse "$LAST_SHA..$NEW_HEAD")
          echo "Found ${#SHAS[@]} new upstream commit(s)."

          for sha in "${SHAS[@]}"; do
            subject=$(git -C upstream-repo log -1 --format=%s "$sha")
            body=$(git -C upstream-repo log -1 --format=%b "$sha")
            {
              [ -n "$body" ] && printf '%s\n\n' "$body"
              printf -- '---\nUpstream commit: %s/commit/%s\n' "${UPSTREAM_REPO%.git}" "$sha"
            } > issue_body.txt
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$subject" --body-file issue_body.txt
          done

          echo "$NEW_HEAD" > "$STATE_FILE"

      - name: Commit updated sync state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-sync/last_sha.txt
          if ! git diff --cached --quiet; then
            git commit -m "upstream-sync: advance to $(cat .github/upstream-sync/last_sha.txt)"
            git push
          fi
