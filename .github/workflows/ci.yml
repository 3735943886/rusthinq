name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Each optional feature must compile and pass on its own, not only in the release set:
  # code shared between a gated and an ungated caller (a method gated on `bridge` that a
  # non-bridge module later starts calling) only breaks in the combination that leaves the
  # feature out, and `--workspace` above unifies features so it never builds that.
  features:
    name: features (${{ matrix.package }}, ${{ matrix.features || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: rusthinq-cloud, features: "" }
          - { package: rusthinq-cloud, features: bridge }
          - { package: rusthinq-cloud, features: native }
          - { package: rusthinq-cloud, features: scripting }
          - { package: rusthinq-cloud, features: gui }
          - { package: rusthinq-cloud, features: "bridge,native,scripting,gui" }
          - { package: rusthinq-devices, features: "" }
          - { package: rusthinq-devices, features: native }
          - { package: rusthinq-devices, features: scripting }
          - { package: rusthinq-devices, features: "native,scripting" }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.package }}-${{ matrix.features }}

      - name: cargo clippy
        run: >
          cargo clippy -p ${{ matrix.package }} --no-default-features
          ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
          --all-targets -- -D warnings

      - name: cargo test
        run: >
          cargo test -p ${{ matrix.package }} --no-default-features
          ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
