hostname = "rusthinq.local" # this can't be an IP address

# /route echoes back the hostname the appliance asked for instead of pointing it to
# `hostname`. Only needed when the appliance was never set up against rusthinq and
# reaches it via port DNAT redirection; leave off for SoftAP setups.
# advertise_requested_host = false

ca_key_file = "ca.key" # created on first run if missing
ca_cert_file = "ca.cert" # created on first run if missing

# Override bind vs. advertised port/address when forwarding or redirection changes what
# devices connect to vs. what rusthinq listens on:
#   https_port = { bind = 4433, advertise = 443 }
#   https_port = { bind = 4433, address = "192.168.0.111", advertise = 443 }
#   https_port = 443
# Diverging from the defaults (443 & 8883) may reduce device compatibility.
https_port = 443
mqtts_port = 8883

# Used internally for legacy ThinQ1 devices. The defaults should be kept unless
# there's a specific reason to change them; same { bind, advertise, address } form
# as https_port/mqtts_port above applies here too.
thinq1_https_port = 46030
thinq1_port = 47878

# Topics logged at INFO; anything unlisted is dropped (no separate debug/trace level).
# Add "all" to enable everything. Available topics:
#   status   - lifecycle/status events (startup, CA cert creation, MQTT connect,
#              orphaned device re-accepted, ThinQ1 HTTP listening, ready)
#   incoming - every message a device publishes to the broker (topic + raw payload,
#              including per-packet traffic) - high-volume, wire-level debugging
#   outgoing - every message rusthinq publishes back to a device
#   HTTPS    - HTTP route hits (e.g. /route, TotalDeviceInfoSvc)
#   bridge   - LG-cloud bridge/relay activity: connect/disconnect, relayed packets,
#              sign-in URL, login/logout outcomes
log = ["status", "incoming", "HTTPS", "bridge"]

[mqtt]
mqtt_url = "mqtt://localhost:1883"
mqtt_user = ""
mqtt_pass = ""
rusthinq_prefix = "rusthinq" # topic prefix for rusthinq's own topics
# Topic prefix for the raw wire-frame observer/inject bus and device simulator, letting a
# trusted local tool watch or fake device traffic. Unset by default (no debug/inject
# surface exists). Can share rusthinq_prefix or use its own value to gate ACLs separately.
raw_prefix = "rusthinq-raw"
# Where the id -> published-property map used to clean up a gone device's retained
# topics is persisted. On by default; defaults to mqtt_state.json next to this file.
# state_file = "mqtt_state.json"

# Optional LG ThinQ cloud bridge (rusthinq-bridge, `bridge` Cargo feature). Absent
# entirely = the feature doesn't exist: no LG login, no relaying adopted devices to
# and from the real LG cloud, and this section is ignored.
# [bridge]
# storage_path = "./state" # LG account credentials (oauth2.json) and per-device bridge state

# Optional device scripting (see rusthinq-devices::scripting). Absent = the feature doesn't
# exist. Put a <modelId>.rhai in rhai_dir to handle that model (e.g.
# rhai_dir/RAC_056905_WW.rhai); shared logic can live in its own .rhai file and be
# imported with `import "common" as common;`.
#
# raw_prefix and a model's .rhai script are independent and never arbitrated - both run
# on every frame for a matching device, with no priority between them. Fine for debug/RE
# use (sniffing traffic, testing an inject before scripting it), but giving a model both
# a raw-only external driver and a .rhai script means two unaware drivers interpreting
# the same data and publishing separately - no crash, but no guarantee they agree.
#
# [devices]
# rhai_dir = "./scripts"
# watch = true # hot-reload on save; keeps the previous version running if the new one fails to compile

# Optional web dashboard (rusthinq-gui, `gui` Cargo feature, off by default). Talks to
# [mqtt] mqtt_url as its own client. The per-device monitor page also needs
# [mqtt] raw_prefix set.
#
# Binds 0.0.0.0 by default: anyone reaching gui_port can enable/disable bridging, trigger
# LG login/logout, and read raw device traffic. Set gui_user/gui_pass (HTTP Basic Auth,
# checked on every route including assets) unless only reachable from a trusted LAN.
# gui_port also takes the { bind, address } form (no advertise):
#  gui_port = { bind = 8080, address = "192.168.0.111" }
#
# [gui]
# gui_port = 44401
# gui_user = ""
# gui_pass = ""
