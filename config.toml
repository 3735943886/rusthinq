hostname = "rusthinq.lan" # this can't be an IP address

# /route echoes back the hostname the appliance asked for instead of pointing it to
# `hostname`. Only needed when the appliance was never set up against rusthinq and
# reaches it via port DNAT redirection; leave off for SoftAP setups.
# advertise_requested_host = false

ca_key_file = "ca.key" # created on first run if missing
ca_cert_file = "ca.cert" # created on first run if missing

# During provisioning each device fetches a root certificate from rusthinq and keeps it to
# validate its TLS connections. By default this is the builtin CA above, which is what a
# typical configuration wants.
#
# If rusthinq sits behind a reverse HTTPS/TLS proxy, the certificate that proxy presents has
# to chain to whatever was distributed here. Either derive the proxy's certificate from
# rusthinq's CA and leave this commented out, or point this at the root certificate that
# validates the proxy's. It changes nothing else: rusthinq's own listeners, and the
# certificates it signs for devices, still come from the builtin CA.
#
# Devices cache what they were given, so changing this does not reach already-paired ones.
# custom_root_cert_file = "root.cert"

# Override bind vs. advertised port/address when forwarding or redirection changes what
# devices connect to vs. what rusthinq listens on:
#   https_port = { bind = 4433, advertise = 443 }
#   https_port = { bind = 4433, address = "192.168.0.111", advertise = 443 }
#   https_port = 443
# `advertise` can also be a full URL instead of just a port, used verbatim -- for a
# reverse proxy on its own hostname/scheme in front of rusthinq:
#   https_port = { bind = 4433, advertise = "https://rusthinq.example.com" }
# Omitting `bind` entirely doesn't listen on that port at all -- for a reverse proxy
# that terminates HTTPS itself and only needs rusthinq to answer the plain HTTP it
# forwards (see `http_port` below), while still advertising the right HTTPS endpoint
# to devices:
#   https_port = { advertise = 443 }
# Diverging from the defaults (443 & 8883) may reduce device compatibility.
https_port = 443
mqtts_port = 8883

# Optional unencrypted HTTP listener alongside https_port, for a reverse proxy that
# terminates TLS itself and forwards plain HTTP here. Absent by default -- no
# plaintext surface exists unless this is set. Takes the same { bind, address } form
# as gui_port below (no `advertise` -- it answers the same routes as https_port,
# which is what decides what devices are told).
# http_port = 80
# http_port = { bind = 80, address = "127.0.0.1" }

# Used internally for legacy ThinQ1 devices. The defaults should be kept unless
# there's a specific reason to change them; same { bind, advertise, address } form
# as https_port/mqtts_port above applies here too.
thinq1_https_port = 46030
thinq1_port = 47878

# Topics logged at INFO; anything unlisted is dropped (no separate debug/trace level).
# Add "all" to enable everything. Available topics:
#   status   - lifecycle/status events (startup, CA cert creation, MQTT connect,
#              orphaned device re-accepted, ThinQ1 HTTP listening, ready)
#   incoming - every message a device publishes to the broker (topic + raw payload,
#              including per-packet traffic) - high-volume, wire-level debugging
#   outgoing - every message rusthinq publishes back to a device
#   HTTPS    - HTTP route hits (e.g. /route, TotalDeviceInfoSvc)
#   bridge   - LG-cloud bridge/relay activity: connect/disconnect, relayed packets,
#              sign-in URL, login/logout outcomes
log = ["status", "HTTPS", "bridge"]

[mqtt]
mqtt_url = "mqtt://localhost:1883"
mqtt_user = ""
mqtt_pass = ""
rusthinq_prefix = "rusthinq" # topic prefix for rusthinq's own topics
# Topic prefix for the raw wire-frame observer/inject bus and device simulator, letting a
# trusted local tool watch or fake device traffic. Unset by default (no debug/inject
# surface exists). Can share rusthinq_prefix or use its own value to gate ACLs separately.
raw_prefix = "rusthinq-raw"
# Which raw-bus streams raw_prefix turns on, listed by name. Leaving `raw` out turns every one
# off, so raw_prefix alone exposes nothing. A stream's topic is
# <raw_prefix>/<id>/raw/<name, "_" read as "/">, e.g. clip_rx -> raw/clip/rx; the commands
# end in /set. A topic's payload never varies: hex for rx/tx/inject/emit, JSON for the rest.
#   rx          packets received from the device
#   tx          packets sent to the device, whoever sent them
#   clip_rx     CLIP messages from the device that nothing local handles -- otherwise
#               dropped unseen unless bridged (low volume)
#   clip_tx     CLIP commands sent to the device, including what the LG cloud sent down
#               while bridged (ThinQ1: its JSON)
#   lg_rx       what the bridge receives from the real LG cloud (bridge feature)
#   lg_tx       what the bridge sends to the real LG cloud      (bridge feature)
#   inject      raw/inject/set: send a packet to the device
#   inject_clip raw/inject/clip/set: send a named CLIP command ({cmd, type, data}) to the
#               device. The cmd is free-form, so this is the broader of the two -- kept apart
#               from `inject` so a consumer that only drives the appliance doesn't get it
#   emit        raw/emit/set: feed a packet in as if the device sent it (also reaches the
#               LG cloud when bridged)
#   sim         raw/sim/...: the device simulator
#
# What needs what:
#   web dashboard, per-device monitor page   rx, tx, clip_tx to watch; inject, emit for its
#                                            send boxes
#   external driver over MQTT (rethink's     rx to read; inject to drive the appliance;
#   rusthinq-adapter)                        inject_clip for its one-off setMaskingInfo
# The default below is the union of the two. Trim it to what you actually run: without the
# dashboard drop "tx", "clip_tx" and "emit"; without an external driver drop "inject" and
# "inject_clip". "clip_rx", "lg_rx", "lg_tx" and "sim" are debugging aids, off unless listed.
raw = ["rx", "tx", "clip_tx", "inject", "inject_clip", "emit"]
# Where the id -> published-property map used to clean up a gone device's retained
# topics is persisted. On by default; defaults to mqtt_state.json next to this file.
# state_file = "mqtt_state.json"

# Optional LG ThinQ cloud bridge (rusthinq-bridge, `bridge` Cargo feature). Absent
# entirely = the feature doesn't exist: no LG login, no relaying adopted devices to
# and from the real LG cloud, and this section is ignored.
# [bridge]
# storage_path = "./state" # LG account credentials (oauth2.json) and per-device bridge state
#
# The appliances find rusthinq through a DNS-level redirect of the ThinQ hostnames, and
# the host running rusthinq usually sits behind the same resolver. If it does, the
# bridge's own outbound connections would resolve straight back to rusthinq instead of
# the real LG cloud unless told to use other servers here, tried in order: each is a
# DNS-over-HTTPS URL or a plain DNS server address. DoH by IP address (as below) works
# even where plain DNS on port 53 is intercepted too. Empty or absent means the system
# resolver.
# dns = ["https://1.1.1.1/dns-query", "https://8.8.8.8/dns-query"]

# Optional device scripting (rusthinq-devices::scripting, `scripting` Cargo feature). Absent
# entirely = the feature doesn't exist. Put a <modelId>.rhai in rhai_dir to handle that
# model (e.g. rhai_dir/RAC_056905_WW.rhai); shared logic can live in its own .rhai file and
# be imported with `import "common" as common;`. The drivers for specific models are the
# separate repository https://github.com/3735943886/rusthinq-scripts -- point rhai_dir at a checkout of it.
#
# raw_prefix and a model's .rhai script are independent and never arbitrated - both run
# on every frame for a matching device, with no priority between them. Fine for debug/RE
# use (sniffing traffic, testing an inject before scripting it), but giving a model both
# a raw-only external driver and a .rhai script means two unaware drivers interpreting
# the same data and publishing separately - no crash, but no guarantee they agree.
#
# [scripting]
# rhai_dir = "./rusthinq-scripts"
# watch = true # hot-reload on save; keeps the previous version running if the new one fails to compile
# il_prefix = "il" # let scripts publish an IL device descriptor (retained, <il_prefix>/<id>); unset = off

# Optional web dashboard (rusthinq-gui, `gui` Cargo feature, off by default). Talks to
# [mqtt] mqtt_url as its own client. The per-device monitor page also needs
# [mqtt] raw_prefix set.
#
# Binds 0.0.0.0 by default: anyone reaching gui_port can enable/disable bridging, trigger
# LG login/logout, and read raw device traffic. Set gui_user/gui_pass (HTTP Basic Auth,
# checked on every route including assets) unless only reachable from a trusted LAN.
# gui_port also takes the { bind, address } form (no advertise):
#  gui_port = { bind = 8080, address = "192.168.0.111" }
#
# [gui]
# gui_port = 44401
# gui_user = ""
# gui_pass = ""
