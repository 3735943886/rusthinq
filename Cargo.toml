[workspace]
members = ["crates/rusthinq-protocol", "crates/rusthinq-lifecycle", "crates/rusthinq-server"]
exclude = ["legacy/0.1"]
resolver = "2"

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
