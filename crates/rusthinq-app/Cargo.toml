[package]
name = "rusthinq-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["bridge", "scripting", "gui"]
bridge = ["dep:rusthinq-bridge"]
scripting = ["dep:rusthinq-scripting"]
gui = []

[dependencies]
toml = "0.8"
rusthinq-server = { path = "../rusthinq-server" }
tempfile = "3"
rusthinq-protocol = { path = "../rusthinq-protocol" }
rusthinq-lifecycle = { path = "../rusthinq-lifecycle" }
rusthinq-bridge = { path = "../rusthinq-bridge", optional = true }
rusthinq-scripting = { path = "../rusthinq-scripting", optional = true }
tokio = { workspace = true, features = ["signal"] }
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
subtle = "2"
url = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
# vendored: builds OpenSSL from source instead of linking the build host's libssl, as 0.1
# did. Needed for musl release targets and keeps the static build independent of the host.
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rusthinq-bridge = { path = "../rusthinq-bridge", features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
