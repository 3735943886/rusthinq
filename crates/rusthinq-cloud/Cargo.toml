[package]
name = "rusthinq-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rusthinq-cloud: emulates LG ThinQ cloud and exposes devices over MQTT"

[[bin]]
name = "rusthinq-cloud"
path = "src/main.rs"

[features]
# All off: a plain `cargo build` matches a minimal deployment (local/SoftAP devices
# only, no LG-cloud bridge, no scripting, no web dashboard). release.yml's actual
# release builds pass --features bridge,scripting,gui explicitly — see the
# individual features below for what each one adds back.
default = []
# Optional forwarding to the real LG cloud (rusthinq_bridge). Off
# (--no-default-features) drops reqwest/oauth2/rsa/hmac/sha1 etc. entirely for
# deployments that only ever run local/SoftAP-adopted devices.
bridge = ["dep:rusthinq-bridge"]
# Rhai device-scripting support for external `.rhai` converters (see
# rusthinq_devices::scripting). Off drops rhai/notify entirely.
scripting = ["rusthinq-devices/scripting"]
# Optional web dashboard (rusthinq_gui), talking to rusthinq-cloud only over MQTT
# like any other client -- see rusthinq-gui's crate docs. Off by default (unlike
# bridge/scripting): a stock build stays exactly what it is today; opting in
# needs both this feature and a `[gui]` config section.
gui = ["dep:rusthinq-gui"]

[dependencies]
rusthinq-util = { workspace = true }
rusthinq-core = { workspace = true }
rusthinq-devices = { workspace = true }
rusthinq-bridge = { workspace = true, optional = true }
rusthinq-gui = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
# Device-facing HTTPS/MQTTS need legacy CBC-SHA / TLS1.0 for RTK_RTL8711am (PR#131).
# rustls deliberately omits those suites; OpenSSL matches the Node device_tls profile.
# vendored: builds OpenSSL from source instead of linking the build host's
# libssl. Needed for musl targets (no system OpenSSL there) and keeps a
# static-linked release build reproducible regardless of the host's OpenSSL.
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6"
rumqttc = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
hyper-util = { workspace = true }
