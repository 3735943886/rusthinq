[package]
name = "rusthinq-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rusthinq-cloud: emulates LG ThinQ cloud and bridges to Home Assistant MQTT"

[[bin]]
name = "rusthinq-cloud"
path = "src/main.rs"

[features]
default = ["bridge"]
# Optional forwarding to the real LG cloud (rusthinq_bridge). Off
# (--no-default-features) drops reqwest/oauth2/rsa/hmac/sha1 etc. entirely for
# deployments that only ever run local/SoftAP-adopted devices against HA.
bridge = ["dep:rusthinq-bridge"]

[dependencies]
rusthinq-util = { workspace = true }
rusthinq-core = { workspace = true }
rusthinq-devices = { workspace = true }
rusthinq-bridge = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
# Device-facing HTTPS/MQTTS need legacy CBC-SHA / TLS1.0 for RTK_RTL8711am (PR#131).
# rustls deliberately omits those suites; OpenSSL matches the Node device_tls profile.
# vendored: builds OpenSSL from source instead of linking the build host's
# libssl. Needed for musl targets (no system OpenSSL there) and keeps a
# static-linked release build reproducible regardless of the host's OpenSSL.
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6"
rumqttc = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
hyper-util = { workspace = true }
