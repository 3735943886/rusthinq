[package]
name = "rusthinq-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional web dashboard for rusthinq-cloud, talking to it only over MQTT"

[lints]
workspace = true

[dependencies]
rusthinq-core = { workspace = true }
rusthinq-util = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
rumqttc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Constant-time credential comparison for HTTP Basic Auth (see http.rs) -- already
# pulled in transitively (rcgen -> ... -> subtle), pinned here as a direct dep since
# we use it ourselves now.
subtle = "2"
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
rusthinq-tools = { workspace = true }
tower = { version = "0.5", features = ["util"] }
